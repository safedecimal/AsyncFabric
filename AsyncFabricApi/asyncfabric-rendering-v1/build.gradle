plugins {
	id 'asyncfabric-api.module'
}

loom {
	accessWidenerPath = file('src/client/resources/asyncfabric-rendering-v1.classtweaker')
}

fabricApiModule {
	moduleDependencies(
		':asyncfabric-api-base',
		':asyncfabric-transitive-access-wideners-v1',
		':asyncfabric-lifecycle-events-v1'
	)

	testDependencies(
		':asyncfabric-client-gametest-api-v1',
		':asyncfabric-item-api-v1',
		':asyncfabric-object-builder-api-v1',
		':asyncfabric-screen-api-v1'
	)
}
