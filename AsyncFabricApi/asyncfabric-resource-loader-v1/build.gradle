plugins {
	id 'asyncfabric-api.module'
}

loom {
	accessWidenerPath = file("src/main/resources/asyncfabric-resource-loader-v1.classtweaker")
}

fabricApiModule {
	moduleDependencies(
		'asyncfabric-api-base'
	)

	testDependencies(
		':asyncfabric-lifecycle-events-v1',
		':asyncfabric-api-base',
		':asyncfabric-gametest-api-v1',
		':asyncfabric-resource-conditions-api-v1',
		':asyncfabric-resource-loader-v1'
	)
}

// Setup 3 test mods used for testing resource sorting
sourceSets {
	testmodA
	testmodB
	testmodC
}

[sourceSets.testmodA, sourceSets.testmodB, sourceSets.testmodC].each { sourceSet ->
	dependencies {
		testmodImplementation sourceSet.output
	}
	rootProject.dependencies {
		testmodImplementation sourceSet.output
	}

	tasks.register("${sourceSet.name}Jar", Jar) {
		from sourceSet.output
		archiveBaseName.set(sourceSet.name)
	}
}

rootProject.allprojects.each { p ->
	if (p.extensions.findByName("loom") == null) {
		return // Skip over the meta projects
	}

	p.loom.mods.register("asyncfabric-resource-loader-v0-testmod-a") {
		sourceSet sourceSets.testmodA
	}
	p.loom.mods.register("asyncfabric-resource-loader-v0-testmod-b") {
		sourceSet sourceSets.testmodB
	}
	p.loom.mods.register("asyncfabric-resource-loader-v0-testmod-c") {
		sourceSet sourceSets.testmodC
	}
}

loom.nestJars(tasks.named("testmodJar"), project.files(
	tasks.testmodAJar,
	tasks.testmodBJar,
	tasks.testmodCJar
))
