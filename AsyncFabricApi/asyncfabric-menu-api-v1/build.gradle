plugins {
	id 'asyncfabric-api.module'
}

loom {
	accessWidenerPath = file('src/main/resources/asyncfabric-menu-api-v1.classtweaker')
}

fabricApiModule {
	moduleDependencies(
		'asyncfabric-api-base',
		'asyncfabric-networking-api-v1',
		'asyncfabric-registry-sync-v0'
	)

	testDependencies(
		':asyncfabric-object-builder-api-v1',
		':asyncfabric-resource-loader-v1',
		':asyncfabric-transitive-access-wideners-v1'
	)
}
