pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		gradlePluginPortal()
	}
}

rootProject.name = "asyncfabric-api"

includeBuild 'build-logic'

include 'asyncfabric-api-bom'
include 'asyncfabric-api-catalog'

def focus = new File('focus.txt')

if (focus.exists()) {
	focus.eachLine {
		include it
	}

	return // Skip the rest of the includes
}

include 'asyncfabric-api-base'
include 'asyncfabric-async-api-v1'

