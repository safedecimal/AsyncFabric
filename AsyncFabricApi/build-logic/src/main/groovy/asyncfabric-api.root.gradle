import net.asyncfabric.impl.build.FabricApiBuildUtils

plugins {
	id "asyncfabric-api.root-versioning"
	id "asyncfabric-api.java"
	id "asyncfabric-api.lint"
	id "asyncfabric-api.loom"
	id "asyncfabric-api.validation"
	id "asyncfabric-api.root-testing"
	id "asyncfabric-api.root-publishing"
}

tasks.named("validateModules") {
	enabled = false
}

loom {
	accessWidenerPath = file("gradle/javadoc.classtweaker")
}

configurations {
	nestedJars {
		transitive = false
	}
}

def includedModuleProjects = rootProject.allprojects.findAll {
	FabricApiBuildUtils.isFabricModule(it) && it != project
}

dependencies {
	for (def moduleProject : includedModuleProjects) {
		api project(path: moduleProject.path)

		if (!FabricApiBuildUtils.DEV_ONLY_MODULES.contains(moduleProject.name)) {
			nestedJars project(moduleProject.path)
		}
	}
}

loom {
	nestJars(tasks.named("jar"), configurations.nestedJars)
	uncompressNestedJars = true
}

tasks.register("checkNoDuplicateFiles", Zip) {
	inputs.files configurations.nestedJars
	destinationDirectory = layout.buildDirectory.dir("test")

	from {
		configurations.nestedJars.files.collect { zipTree(it) }
	}

	exclude 'META-INF/**'
	exclude 'asyncfabric.mod.json'
	// build-time legacy copy emitted for Loom; intentionally identical in every module
	exclude 'fabric.mod.json'
}

check.dependsOn "checkNoDuplicateFiles"

/*
 * Build the jar of every module that publishes a classtweaker before anything else.
 *
 * Loom computes each project's remapped Minecraft jar from the classtweakers it can see, and it
 * reads them out of dependency *jars*. On a clean checkout those jars do not exist yet, so a module
 * that relies on a `transitive-` entry from a dependency is compiled against a jar where the
 * injected interface or widened member is missing, and the build fails with "cannot find symbol"
 * for something the classtweaker was supposed to provide.
 *
 * The failure looks random: it appears in a fresh clone, disappears in a warm one where the jars
 * were left from an earlier run, and the set of failing modules shifts between runs. Building the
 * providers first makes it deterministic.
 *
 * The list is derived from the classtweaker files themselves, so a new module or a newly added
 * classtweaker is covered without editing this file.
 */
def classTweakerProviders = includedModuleProjects.findAll { moduleProject ->
	moduleProject.file("src/main/resources/${moduleProject.name}.classtweaker").exists()
			|| moduleProject.file("src/client/resources/${moduleProject.name}.classtweaker").exists()
}

tasks.register("classTweakerJars") {
	group = "build"
	description = "Assembles the jars of every module that publishes a classtweaker"

	dependsOn classTweakerProviders.collect { "${it.path}:jar" }
}

allprojects { target ->
	if (target == project || !FabricApiBuildUtils.isFabricModule(target)) {
		return
	}

	// withType instead of matching{}.configureEach: the compile tasks are created after this
	// script runs, and a name-based matcher does not pick them up retroactively.
	target.tasks.withType(JavaCompile).configureEach { task ->
		if (task.name == "compileJava" || task.name == "compileClientJava") {
			task.dependsOn rootProject.tasks.named("classTweakerJars")
		}
	}
}
