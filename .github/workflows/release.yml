name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.20.1-async
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # The API resolves the loader from mavenLocal(), so the loader goes first.
      # GITHUB_ACTIONS is cleared so the published version matches the "+async.local" the API's
      # version catalog pins; otherwise the API cannot resolve the loader.
      - name: Build loader
        working-directory: AsyncFabricLoader
        env:
          GITHUB_ACTIONS: "false"
        run: ./gradlew build publishToMavenLocal -x javadoc --stacktrace

      - name: Build API
        working-directory: AsyncFabricApi
        run: ./gradlew build -x javadoc --stacktrace

      - name: Collect release files
        run: |
          mkdir -p release

          # The executable loader jar plus the installer metadata listing the libraries it needs.
          # The -fat jar is an intermediate that shadows the real one, so it is skipped.
          for file in AsyncFabricLoader/build/libs/asyncfabric-loader-*.jar; do
            case "$file" in
              *-sources.jar|*-javadoc.jar|*-fat.jar|*-signed.jar) ;;
              *) cp "$file" release/ ;;
            esac
          done
          cp AsyncFabricLoader/build/libs/asyncfabric-loader-*.json release/ 2>/dev/null || true

          # The aggregate API jar already nests every module.
          for file in AsyncFabricApi/build/libs/asyncfabric-api-*.jar; do
            case "$file" in
              *-sources.jar|*-javadoc.jar|*-testmod.jar) ;;
              *) cp "$file" release/ ;;
            esac
          done

          ls -la release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AsyncFabric ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: release/*.jar
          fail_on_unmatched_files: true
