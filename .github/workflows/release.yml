name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.20.1-async
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # The API resolves the loader from mavenLocal(), so the loader goes first.
      - name: Build loader
        working-directory: AsyncFabricLoader
        run: ./gradlew build publishToMavenLocal -x javadoc --stacktrace

      - name: Align the API's loader version with what was published
        # GITHUB_ACTIONS cannot be overridden from `env:` — the runner injects it — so the loader
        # publishes "+async" here while the catalog pins "+async.local". Rewrite the pin instead
        # of fighting the variable. Module manifests depend on ">=0.20.1" without build metadata,
        # so changing the catalog entry is safe.
        run: |
          published=$(ls "$HOME/.m2/repository/net/asyncfabric/asyncfabric-loader/" | grep '^0\.' | head -1)
          echo "Published loader: $published"
          python3 - "$published" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("AsyncFabricApi/gradle/libs.versions.toml")
          out = []
          for line in path.read_text(encoding="utf-8").splitlines(keepends=True):
              # Only the [versions] entry holds a bare quoted version. The [libraries] entry
              # reuses the same alias with a map value; rewriting it breaks the catalog.
              if re.match(r'^asyncfabric-loader\s*=\s*"[^"]*"\s*$', line):
                  out.append(f'asyncfabric-loader = "{version}"\n')
              else:
                  out.append(line)
          path.write_text("".join(out), encoding="utf-8")
          PY
          grep '^asyncfabric-loader = ' AsyncFabricApi/gradle/libs.versions.toml

      - name: Verify the published loader version
        run: |
          expected=$(awk -F'"' '/^asyncfabric-loader = /{print $2; exit}' AsyncFabricApi/gradle/libs.versions.toml)
          echo "API expects: $expected"
          ls ~/.m2/repository/net/asyncfabric/asyncfabric-loader/
          if [ ! -f "$HOME/.m2/repository/net/asyncfabric/asyncfabric-loader/$expected/asyncfabric-loader-$expected.pom" ]; then
            echo "::error::published loader version does not match the API version catalog"
            exit 1
          fi

      - name: Build API
        working-directory: AsyncFabricApi
        env:
          # Marks the API version as a release build. Without it the version suffix comes from
          # `git rev-parse --abbrev-ref HEAD`, which on a tag checkout answers "HEAD".
          ASYNC_RELEASE: "true"
        run: bash ./build-api.sh --stacktrace

      - name: Collect release files
        run: |
          mkdir -p release

          # The executable loader jar plus the installer metadata listing the libraries it needs.
          # The -fat jar is an intermediate that shadows the real one, so it is skipped.
          for file in AsyncFabricLoader/build/libs/asyncfabric-loader-*.jar; do
            case "$file" in
              *-sources.jar|*-javadoc.jar|*-fat.jar|*-signed.jar) ;;
              *) cp "$file" release/ ;;
            esac
          done
          cp AsyncFabricLoader/build/libs/asyncfabric-loader-*.json release/ 2>/dev/null || true

          # The aggregate API jar already nests every module. The javadoc classifier here is
          # "fatjavadoc", not "javadoc", so it needs its own entry; without it an empty 261-byte
          # jar lands in the release.
          for file in AsyncFabricApi/build/libs/asyncfabric-api-*.jar; do
            case "$file" in
              *-sources.jar|*-javadoc.jar|*-fatjavadoc.jar|*-testmod.jar) ;;
              *) cp "$file" release/ ;;
            esac
          done

          ls -la release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AsyncFabric ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          # The .json is not cosmetic: the loader resolves Mixin and ASM from it, so a release
          # without it cannot start. Attaching only `*.jar` silently dropped it.
          files: |
            release/*.jar
            release/*.json
          fail_on_unmatched_files: true
