name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # The API resolves the loader through mavenLocal(), so both projects build in one job. A
      # separate job would have to hand ~/.m2 across, and a cache restore that silently misses
      # turns into "Could not find net.asyncfabric:asyncfabric-loader" instead of a build error.
      #
      # GITHUB_ACTIONS is cleared for the publish step on purpose: the loader stamps its version
      # with "+async" on CI and "+async.local" locally, while the API's version catalog pins
      # "+async.local". Leaving it set publishes a version the API never asks for. It must be
      # empty, not "false": the loader only checks truthiness.
      - name: Build loader
        working-directory: AsyncFabricLoader
        run: ./gradlew build -x javadoc --stacktrace

      - name: Publish loader to the local maven repository
        working-directory: AsyncFabricLoader
        run: ./gradlew publishToMavenLocal -x javadoc --stacktrace

      - name: Align the API's loader version with what was published
        # GITHUB_ACTIONS cannot be overridden from `env:` — the runner injects it — so the loader
        # publishes "+async" here while the catalog pins "+async.local". Rewrite the pin instead
        # of fighting the variable. Module manifests depend on ">=0.20.1" without build metadata,
        # so changing the catalog entry is safe.
        run: |
          published=$(ls "$HOME/.m2/repository/net/asyncfabric/asyncfabric-loader/" | grep '^0\.' | head -1)
          echo "Published loader: $published"
          python3 - "$published" <<'PY'
          import sys, pathlib
          version = sys.argv[1]
          path = pathlib.Path("AsyncFabricApi/gradle/libs.versions.toml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          out = [
              f'asyncfabric-loader = "{version}"\n' if line.startswith("asyncfabric-loader = ") else line
              for line in lines
          ]
          path.write_text("".join(out), encoding="utf-8")
          PY
          grep '^asyncfabric-loader = ' AsyncFabricApi/gradle/libs.versions.toml

      - name: Verify the published loader version
        # Fail here with a clear message instead of letting the API report
        # "could not find net.asyncfabric:asyncfabric-loader".
        run: |
          expected=$(awk -F'"' '/^asyncfabric-loader = /{print $2; exit}' AsyncFabricApi/gradle/libs.versions.toml)
          echo "API expects: $expected"
          echo "Published:"
          ls ~/.m2/repository/net/asyncfabric/asyncfabric-loader/
          if [ ! -f "$HOME/.m2/repository/net/asyncfabric/asyncfabric-loader/$expected/asyncfabric-loader-$expected.pom" ]; then
            echo "::error::published loader version does not match the API version catalog"
            exit 1
          fi

      - name: Build API
        # Known unstable. Symptoms: compilation fails with "cannot find symbol" for methods that
        # only exist through a classtweaker (addTask, completeTask, getFabricPackSource,
        # getTranslationKey), on a tree whose sources are byte-identical to one that builds. The
        # failing module set changes between runs, so this is a Loom/remap interaction, not a code
        # problem. Not yet isolated; see FORK.md. The step is deliberately not silenced: a green
        # run should mean the API really built.
        #
        # -x javadoc: javadoc is not a gate here and needs the full remapped classpath.
        working-directory: AsyncFabricApi
        run: ./gradlew build -x javadoc --stacktrace

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Test results"
            echo
            found=0
            for report in $(find AsyncFabricApi AsyncFabricLoader -path '*/test-results/test/*.xml' 2>/dev/null); do
              found=1
              tests=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
              failures=$(grep -o 'failures="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
              errors=$(grep -o 'errors="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
              name=$(basename "$report" .xml | sed 's/^TEST-//')
              echo "| \`$name\` | $tests | $failures | $errors |"
            done
            if [ "$found" = "0" ]; then
              echo "No test reports found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: asyncfabric-loader
          # The executable jar plus the installer metadata listing the libraries it needs
          # (Mixin, ASM, ...). Those are not bundled, so the json matters.
          path: |
            AsyncFabricLoader/build/libs/asyncfabric-loader-*.jar
            AsyncFabricLoader/build/libs/asyncfabric-loader-*.json
            !AsyncFabricLoader/build/libs/*-sources.jar
            !AsyncFabricLoader/build/libs/*-javadoc.jar
            !AsyncFabricLoader/build/libs/*-fat.jar
            !AsyncFabricLoader/build/libs/*-signed.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: asyncfabric-api
          # The aggregate jar nests every module jar, so per-module jars are left out.
          path: |
            AsyncFabricApi/build/libs/asyncfabric-api-*.jar
            !AsyncFabricApi/build/libs/*-sources.jar
            !AsyncFabricApi/build/libs/*-javadoc.jar
            !AsyncFabricApi/build/libs/*-testmod.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            AsyncFabricApi/**/build/reports/tests/
            AsyncFabricLoader/build/reports/tests/
          if-no-files-found: ignore
